# yaml-language-server: $schema=https://tobiasduerschmid.github.io/js/ArchUML/c4/schema/1/design.schema.json
# The reference model (course-registration.yml) plus what the editable UML views need to be tested on
# (UML-view editing spec §4.1, plan Task 26):
#   - Seat Gateway (seats) has a code element, SeatLedger, with a collaborator to a component of another container
#     (Live Seat Board in the Planner Web App) and one to the Billing System: the code view of seats draws two lifted
#     boxes, and in the deployment view the Billing System path from the API merges two relationships.
#   - Enrollment Policy (policy) has two code elements named "Seat Holds" and "Seat_Holds", whose drawn aliases collide.
#   - The scenario probe has a step whose end is no element (registrar) between two valid steps, a loop nested in an
#     alt with an empty branch, and one invalid step for each reason a step can be invalid.
#   - The Registration API is hosted on two nodes (API pod and Canary pod).
# The one model diagnostic it has is the unknown element registrar.
schema: c4-design/1
name: Course Registration
description: Students build a conflict-free term schedule and enroll in its sections.
status: proposed
enterprise: UCLA

requirements:
  FR-07: A student can see why two sections clash before enrolling.
  FR-09: A student is enrolled in every section of a plan, or in none.

people:
  student:
    name: Student
    description: Plans and confirms one term schedule.
    collaborators:
      web: plans a schedule and enrolls using

systems:
  registration:
    name: Course Registration
    description: Builds conflict-free schedules and enrolls students in their sections.
    responsibilities:
      - decide: whether a student may enroll in a section
        id: sys-eligibility
        requirements: [FR-07]
      - do: hold a seat in every section of a plan, or in none
        id: sys-holds
        requirements: [FR-09]
    containers:
      web:
        name: Planner Web App
        kind: browser_app
        technology: TypeScript, React
        description: Lets students compare draft schedules in the browser.
        responsibilities:
          - do: let students compare draft schedules
        collaborators:
          coordinator: {description: submits plans to, technology: JSON/HTTPS}
        components:
          seat-board:
            name: Live Seat Board
            technology: React component
            description: Shows how many seats are left in each section of a plan.
      api:
        name: Registration API
        technology: Python, FastAPI
        description: Decides eligibility and enrolls students atomically.
        responsibilities:
          - decide: whether a student may enroll in a section
            id: api-eligibility
            refines: sys-eligibility
          - do: hold a seat in every section of a plan, or in none
            id: api-holds
            refines: sys-holds
        choices:
          technology:
            chosen: FastAPI 0.115 on Python 3.12
            alternatives: [Django REST Framework, Flask]
            because: typed request models and async database access
          styles: [layers]
        components:
          coordinator:
            name: Registration Coordinator
            technology: Python module
            stereotypes: [coordinator]
            responsibilities:
              - do: sequence one enrollment attempt
              - decide: which step of the attempt runs next
            collaborators:
              policy: asks for an eligibility decision from
              seats: reserves all seats or none through
              billing-gateway: asks for tuition charges through
            provides: ["evaluate(proposal) -> Outcome"]
            invariants: [never decides eligibility or writes seat state]
            quality: [an enrollment outcome appears within 2 s for 95% of attempts]
          policy:
            name: Enrollment Policy
            technology: Python module
            stereotypes: [service_provider]
            responsibilities:
              - decide: whether prerequisites and unit caps allow enrollment
                refines: api-eligibility
            code:
              EnrollmentPolicy:
                kind: class
                operations: ["+ decide(student, section): Decision"]
                collaborators: {EnrollmentRule: asks each rule to evaluate the student with}
                choices: {patterns: [{pattern: Strategy, role: Context, instance: eligibility-rules}]}
              EnrollmentRule:
                kind: interface
                operations: ["+ evaluate(student, section): RuleResult"]
                choices: {patterns: [{pattern: Strategy, role: Strategy, instance: eligibility-rules}]}
              PrerequisiteRule:
                kind: class
                implements: [EnrollmentRule]
                operations: ["+ evaluate(student, section): RuleResult"]
                choices: {patterns: [{pattern: Strategy, role: ConcreteStrategy, instance: eligibility-rules}]}
              UnitCapRule:
                kind: class
                implements: [EnrollmentRule]
                operations: ["+ evaluate(student, section): RuleResult"]
                choices: {patterns: [{pattern: Strategy, role: ConcreteStrategy, instance: eligibility-rules}]}
              SeatHolds:
                name: Seat Holds
                kind: class
                operations: ["+ count(section): int"]
              SeatHoldRows:
                name: Seat_Holds
                kind: class
                attributes: ["- rows: list"]
          seats:
            name: Seat Gateway
            technology: Python module
            stereotypes: [interfacer]
            owns: [seat holds]
            responsibilities:
              - know: which seats are held for each attempt
              - do: hold every requested seat atomically, or none
                refines: api-holds
            collaborators:
              db: {description: writes seat holds to, technology: SQL/TCP}
            code:
              SeatLedger:
                kind: class
                operations: ["+ hold(section): Hold"]
                collaborators:
                  seat-board: {description: pushes seat counts to, technology: WebSocket}
                  billing: {description: reports the held seats to, technology: AMQP, connector: message}
          billing-gateway:
            name: Billing Gateway
            technology: Python module
            stereotypes: [interfacer]
            responsibilities:
              - do: request tuition charges for a completed enrollment
            collaborators:
              billing:
                description: requests tuition charges from
                technology: AMQP
                connector: message
                choices:
                  technology: {chosen: RabbitMQ, alternatives: [synchronous HTTPS call], because: a billing outage must not block enrollment}
      db:
        name: Registration Database
        kind: database
        technology: PostgreSQL 16
        description: Durably stores plans, enrollment attempts, and seat holds.
        responsibilities:
          - do: durably store plans, enrollment attempts, and seat holds
  billing:
    name: Billing System
    external: true
    description: Charges tuition and fees for the university.

scenarios:
  enroll:
    title: Enroll in a planned schedule
    steps:
      - web -> coordinator: submits the plan to
      - coordinator -> policy: asks for an eligibility decision from
      - alt:
          - when: eligible
            steps:
              - coordinator -> seats: reserves all seats or none through
              - coordinator -> billing-gateway: asks for tuition charges through
          - when: not eligible
            steps:
              - coordinator -> web: reports the refusal and its reason to
  probe:
    title: Probe every kind of step
    steps:
      - web -> coordinator: submits the plan to
      - web -> registrar: asks a registrar about
      - coordinator -> policy: asks for an eligibility decision from
      - alt:
          - when: sections are open
            steps:
              - loop:
                  when: each section
                  steps:
                    - coordinator -> seats: reserves a seat through
          - when: no section is open
      - db -> seats: returns the seat holds to
      - billing -> billing-gateway: confirms the charge to
      - web -> policy: asks for a decision from

deployment:
  production:
    name: Production
    nodes:
      laptop:
        name: Student's computer
        kind: device
        nodes:
          browser: {name: Web browser, kind: environment, technology: "Chrome, Firefox, or Safari", hosts: [web]}
      campus-cloud:
        name: Campus cloud
        kind: environment
        technology: Kubernetes
        nodes:
          ingress:
            name: Ingress load balancer
            kind: infrastructure
            technology: NGINX
            collaborators:
              api-pod: forwards HTTPS requests to
          api-pod: {name: API pod, kind: environment, technology: Docker, instances: 3, hosts: [api]}
          canary: {name: Canary pod, kind: environment, technology: Docker, hosts: [api]}
          postgres: {name: Managed database, kind: environment, technology: PostgreSQL 16, hosts: [db]}
      data-centre:
        name: University data centre
        kind: environment
        hosts: [billing]

decisions:
  one-database:
    title: Keep plans and seat holds in one relational database
    status: accepted
    context: Seat holds and enrollment must commit atomically.
    decision: One PostgreSQL database with serializable transactions for seat holds.
    alternatives: [a separate seat service with its own store]
    consequences: The database is a single point of failure.
    affects: [db, seats]
